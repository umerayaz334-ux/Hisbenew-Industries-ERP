name: Deploy frontend to cPanel

on:
  # Localhost mode: do not deploy automatically on push.
  workflow_dispatch:
    inputs:
      use_live_site_host:
        description: Use app.hisbenew.com as the FTP host after a hosting migration
        type: boolean
        default: false

concurrency:
  group: frontend-cpanel-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and upload frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      VITE_API_BASE_URL: "${{ vars.VITE_API_BASE_URL || 'https://api.hisbenew.com' }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # APKs are built and verified separately with the installed app's signing key.
      # The web build publishes the exact signed asset pinned in mobile-release.json.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci


      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check deployment host routing
        env:
          SAVED_FTP_HOST: ${{ secrets.CPANEL_FTP_SERVER }}
        run: |
          node --input-type=module <<'JS'
          import dns from 'node:dns/promises';
          const addresses = async (host) => {
            try { return (await dns.lookup(host, { all: true })).map(row => row.address); }
            catch { return []; }
          };
          const saved = await addresses(process.env.SAVED_FTP_HOST);
          const live = await addresses('app.hisbenew.com');
          console.log(JSON.stringify({savedHostResolved: saved.length > 0, liveSiteResolved: live.length > 0, savedHostMatchesLiveSite: saved.some(address => live.includes(address))}));
          JS

      - name: Deploy dist to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ inputs.use_live_site_host && 'app.hisbenew.com' || secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ${{ vars.CPANEL_FTP_PROTOCOL || 'ftps' }}
          local-dir: frontend/dist/
          server-dir: ${{ vars.CPANEL_PUBLIC_HTML_DIR || 'public_html/' }}

      - name: Verify live frontend
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 10 https://app.hisbenew.com/
          curl --fail --silent --show-error --retry 5 --retry-delay 10 -I https://app.hisbenew.com/login
          curl --fail --silent --show-error --retry 5 --retry-delay 10 -I https://app.hisbenew.com/downloads/hisbenew-factory-erp.apk

      - name: Verify live forwarding controls and signed APK manifest
        run: node scripts/verify-live-forwarding.mjs
