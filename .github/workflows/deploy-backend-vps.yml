name: Deploy backend to Windows VPS

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "scripts/deploy-backend.ps1"
      - ".github/workflows/deploy-backend-vps.yml"
  workflow_dispatch:

concurrency:
  group: backend-vps-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate backend
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: pwsh
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend unit tests
        run: python -m unittest discover -s tests

  deploy:
    name: Pull and restart backend on VPS
    needs: validate
    runs-on:
      - self-hosted
      - Windows
      - hisbenew-vps
    timeout-minutes: 20

    defaults:
      run:
        shell: powershell

    env:
      ERP_ROOT: ${{ vars.ERP_ROOT }}
      ERP_BACKEND_VENV: ${{ vars.ERP_BACKEND_VENV }}
      ERP_BACKEND_SERVICE_NAME: ${{ vars.ERP_BACKEND_SERVICE_NAME }}
      ERP_BACKEND_HEALTH_URL: ${{ vars.ERP_BACKEND_HEALTH_URL }}
      ERP_PUBLIC_API_HEALTH_URL: ${{ vars.ERP_PUBLIC_API_HEALTH_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy backend
        run: .\scripts\deploy-backend.ps1
