services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hisbenew_erp}
      POSTGRES_USER: ${POSTGRES_USER:-hisbenew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
    volumes:
      - erp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hisbenew} -d ${POSTGRES_DB:-hisbenew_erp}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - erp_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  erp:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    environment:
      APP_DATA_DIR: /data
      STATIC_DIR: /data/static
      FRONTEND_DIST_DIR: /app/frontend-dist
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hisbenew}:${POSTGRES_PASSWORD:-change-this-database-password}@db:5432/${POSTGRES_DB:-hisbenew_erp}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      SECRET_KEY: ${SECRET_KEY:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      INTERNAL_CALL_ICE_SERVERS: ${INTERNAL_CALL_ICE_SERVERS:-}
      AMAZON_CREDENTIALS_ENCRYPTION_KEY: ${AMAZON_CREDENTIALS_ENCRYPTION_KEY:-}
      PORT: 8000
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  erp_postgres:
  erp_redis:
